version: '4.74.0'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: fall_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: falldetection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ánh xạ file schema v1 để tự động tạo bảng khi khởi chạy
      - ./db_schema_v1.sql:/docker-entrypoint-initdb.d/db_schema_v1.sql

  # 2. Bộ điều phối tin nhắn RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fall_mq
    restart: always
    ports:
      - "5672:5672"   # Cổng kết nối dữ liệu (AMQP)
      - "15672:15672" # Cổng quản lý Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 3. Ứng dụng Backend FastAPI
  backend:
    build: .
    container_name: fall_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app # Mount code để hot-reload khi bạn sửa code ở máy thật
    environment:
      - DATABASE_URL=postgresql://postgres:your_password@db:5432/falldetection
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - db
      - rabbitmq

volumes:
  postgres_data: